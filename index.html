<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ширээний хуваарь</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Manrope:wght@300;400;500&display=swap&subset=cyrillic" rel="stylesheet">
<style>
  :root{
    --bg:#ECEBE8; --ink:#232322; --muted:#8B8983; --line:#CFCDC8; --panel:#F6F5F3; --accent:#7D6B4F; --entry:#E0574F; --ok:#2F8F5B;
    color-scheme:light;
    --serif:"Cormorant Garamond","Times New Roman",serif; --sans:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-weight:300;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
    -webkit-font-smoothing:antialiased;
  }
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:9vh 24px 48px}

  .hero{display:flex;flex-direction:column;align-items:center;text-align:center}
  .logo{height:84px;max-width:260px;object-fit:contain}
  .wordmark{font-family:var(--serif);font-weight:400;font-size:26px;letter-spacing:.32em;text-indent:.32em;white-space:nowrap}
  h1{
    font-family:var(--serif);font-weight:300;font-size:clamp(38px,10vw,56px);line-height:1.1;
    letter-spacing:.01em;margin-top:40px;
  }
  .hint{margin-top:12px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .hint + .hint{margin-top:4px}

  .search{position:relative;width:100%;max-width:420px;margin-top:36px}
  .search input{
    width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
    padding:14px 2px;font:inherit;font-size:20px;font-weight:300;color:var(--ink);outline:none;
    transition:border-color .2s;
  }
  .search input::placeholder{color:var(--muted)}
  .search input:focus{border-bottom-color:var(--ink)}
  .list{
    position:absolute;left:0;right:0;top:100%;margin-top:6px;background:var(--panel);
    border:1px solid var(--line);max-height:46vh;overflow:auto;list-style:none;padding:4px 0;z-index:5;
  }
  .list[hidden]{display:none}
  .list li{padding:14px 16px;font-size:17px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
  .list li small{color:var(--muted);font-size:13px;align-self:center;white-space:nowrap}
  .list li[aria-selected="true"],.list li:hover{background:var(--bg)}
  .list li.msg{cursor:default;color:var(--muted);font-size:15px;line-height:1.5}
  .list li.msg:hover{background:none}
  .status{margin-top:20px;font-size:14px;color:var(--muted);min-height:20px;text-align:center}

  /* result popup */
  .overlay{
    position:fixed;inset:0;background:rgba(20,20,19,.45);display:flex;align-items:flex-end;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:10;
  }
  .overlay.open{opacity:1;pointer-events:auto}
  .sheet{
    background:var(--panel);width:100%;max-width:560px;max-height:94vh;overflow:auto;
    padding:36px 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center;
    transform:translateY(24px);transition:transform .3s ease;
  }
  .overlay.open .sheet{transform:none}
  @media (min-width:640px){ .overlay{align-items:center} .sheet{padding:44px 40px 36px;max-width:900px} }
  .guest{font-size:16px;color:var(--muted)}
  .tag{margin-top:4px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .tag:empty{display:none}
  .num{font-family:var(--sans);font-weight:400;font-size:88px;line-height:1;margin:10px 0 8px;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
  .line{font-size:18px}

  /* attendance */
  .att{margin-top:22px;display:flex;flex-direction:column;align-items:center}
  .primary{
    background:var(--ink);color:var(--bg);border:1px solid var(--ink);font:inherit;font-size:16px;font-weight:400;
    padding:15px 32px;width:100%;max-width:340px;cursor:pointer;transition:opacity .2s;
  }
  .primary:hover{opacity:.88}
  .primary:disabled{opacity:.55;cursor:default}
  .att-done{display:inline-flex;align-items:center;gap:8px;color:var(--ok);font-size:16px;font-weight:400}
  .att-done svg{width:22px;height:22px}
  .att-err{margin-top:10px;font-size:14px;color:#B3402F}
  .att-err:empty{display:none}

  /* table plan (drawn SVG) */
  .plan{margin:28px 0 24px;border:1px solid var(--line);background:var(--bg);overflow-x:auto;-webkit-overflow-scrolling:touch}
  .plan svg{display:block;width:100%;min-width:820px;height:auto}
  .plan svg .zone{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 4}
  .plan svg .floor{fill:var(--line);opacity:.55}
  .plan svg .block{fill:var(--line);opacity:.8}
  .plan svg .block-t{font:600 11px var(--sans);fill:var(--muted);letter-spacing:.06em;text-anchor:middle;dominant-baseline:central}
  .plan svg .stage-t{font:600 17px var(--sans);fill:var(--muted);letter-spacing:.1em;text-anchor:middle;dominant-baseline:central}
  .plan svg .entry path{fill:var(--entry)}
  .plan svg .entry text{font:600 10px var(--sans);fill:var(--entry);letter-spacing:.14em;text-anchor:middle}
  .plan svg .tbl circle{fill:var(--panel);stroke:var(--muted);stroke-width:1}
  .plan svg .tbl .ch rect{fill:none;stroke:var(--line);stroke-width:1}
  .plan svg .tbl text{font:400 17px var(--sans);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
  .plan.has-hi svg .tbl:not(.hi),.plan.has-hi svg .pill:not(.hi){opacity:.5}
  .plan svg .tbl.hi circle{fill:var(--accent);stroke:var(--accent)}
  .plan svg .tbl.hi .ch rect{stroke:var(--accent)}
  .plan svg .tbl.hi text{fill:#fff;font-weight:500;font-size:20px}
  .plan svg .pill ellipse{fill:var(--panel);stroke:var(--accent);stroke-width:1}
  .plan svg .pill text{font:italic 400 12px var(--serif);fill:var(--ink);text-anchor:middle;dominant-baseline:central}
  .plan svg .pill.hi ellipse{fill:var(--accent)}
  .plan svg .pill.hi text{fill:#fff}
  .plan svg circle.ring,.plan svg ellipse.ring{
    fill:none;stroke:var(--accent);stroke-width:1.8;
    transform-box:fill-box;transform-origin:center;animation:ring 1.8s ease-out infinite;
  }
  @keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.7);opacity:0}}

  /* success window */
  .overlay.center{align-items:center;z-index:20}
  .ok{background:var(--panel);width:min(380px,calc(100% - 48px));padding:44px 28px 32px;text-align:center}
  .ok svg{width:84px;height:84px}
  .ok .okc{fill:none;stroke:var(--ok);stroke-width:3;stroke-dasharray:226;stroke-dashoffset:226}
  .ok .okp{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
  .overlay.open .ok .okc{animation:draw .6s ease forwards}
  .overlay.open .ok .okp{animation:draw .4s .45s ease forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .ok h2{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1.2;margin:22px 0 8px}
  .ok p{font-size:15px;color:var(--muted);margin-bottom:28px}
  @media (prefers-reduced-motion:reduce){
    .ring{animation:none!important} .sheet,.overlay{transition:none}
    .overlay.open .ok .okc,.overlay.open .ok .okp{animation:none;stroke-dashoffset:0}
  }

  .close{
    background:none;border:1px solid var(--ink);color:var(--ink);font:inherit;font-size:15px;
    padding:12px 40px;cursor:pointer;transition:background .2s,color .2s;
  }
  .close:hover{background:var(--ink);color:var(--bg)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
  <header class="hero">
    <div id="brand"></div>
    <h1>Ширээний хуваарь</h1>
    <p class="hint">Монголоор бичин хайна уу.</p>
    <p class="hint">Please type in English for foreign names.</p>
  </header>

  <div class="search">
    <input id="q" type="search" placeholder="Нэрээ бичнэ үү" autocomplete="off" autocapitalize="words"
           role="combobox" aria-expanded="false" aria-controls="list" aria-label="Нэрээ бичнэ үү">
    <ul id="list" class="list" role="listbox" hidden></ul>
  </div>
  <p class="status" id="status" role="status">Жагсаалт ачаалж байна…</p>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resName">
  <div class="sheet">
    <p class="guest" id="resName"></p>
    <p class="tag" id="resTag"></p>
    <p class="num" id="resNum"></p>
    <p class="line" id="resLine"></p>
    <div class="att" id="attBox" hidden>
      <button class="primary" id="attBtn" type="button">Ирснээ баталгаажуулах</button>
      <p class="att-done" id="attDone" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="var(--ok)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Ирц бүртгэгдсэн байна
      </p>
      <p class="att-err" id="attErr" role="alert"></p>
    </div>
    <div class="plan" id="resPlan"></div>
    <button class="close" id="closeBtn">Хаах</button>
  </div>
</div>

<div class="overlay center" id="okOverlay" role="dialog" aria-modal="true" aria-labelledby="okTitle">
  <div class="ok">
    <svg viewBox="0 0 80 80" aria-hidden="true"><circle class="okc" cx="40" cy="40" r="36"/><path class="okp" d="M24 41l12 12 21-24"/></svg>
    <h2 id="okTitle">Хөгжилтэй өнгөрүүлээрэй!</h2>
    <p>Таны ирц бүртгэгдлээ.</p>
    <button class="close" id="okClose" type="button">Хаах</button>
  </div>
</div>

<script>
/* ================= CONFIG: зөвхөн эндээс өөрчилнө ================= */
const CONFIG = {
  // Google Sheet-ийн URL доторх ID:  docs.google.com/spreadsheets/d/ ЭНД_БАЙНА /edit
  // Sheet: Share → "Anyone with the link" → Viewer
  SHEET_ID: "1Rp2uI50S__aafMFYG4w0Ujhg6F2Eot5rD5YvSai0zJc",
  SHEET_NAME: "Hurim list",      // доод талын tab-ийн нэр
  LOGO_URL: "logo.png",      // index.html-тэй нэг хавтсанд байрлуулна
  LOGO_TEXT: "Logo",    // logo.png олдохгүй бол энэ текст гарна
  ATTENDANCE_URL: "https://script.google.com/macros/s/AKfycbwWmOtWeXOy-A36kvAcEDp02VerSr2D9mbxe77f2blHnAkN59Fm48sTAMXgszumjcPX/exec"    // Apps Script "Web app" URL (…/exec). Хоосон бол "Ирснээ баталгаажуулах" товч гарахгүй
};
/* ================================================================= */

/* Ширээний байрлал (шинэ зургаас): түлхүүр → [x, y]. Хүснэгтийн 2-р баганад яг эдгээр нэр бичигдэнэ.
   "хос" = Хосын ширээ */
const LAYOUT = {
  "1":[536,320],"2":[592,259],"3":[641,323],"4":[693,268],"5":[641,137],"6":[642,56],
  "7":[554,136],"8":[554,57],"9":[462,137],"10":[467,57],"11":[376,138],"12":[378,57],
  "13":[291,138],"14":[290,60],"15":[229,307],"16":[220,224],"17":[192,140],"18":[140,311],
  "19":[131,225],"20":[99,141],"21":[56,311],"22":[47,224],
  "хос":[366,342]
};
const VIEW = {x:-6, y:-6, w:900, h:376};

const DEMO = [];

const $ = id => document.getElementById(id);
let guests = [];
let active = -1, shown = [];

/* ---------- table labels ---------- */
const isNum = k => /^\d+$/.test(k);
const labelOf = k => k==="хос" ? "Хос" : k.toUpperCase();
const shortOf = k => k==="хос" ? "Хосын ширээ" : isNum(k) ? `${k}-р ширээ` : `${labelOf(k)} ширээ`;
const sayOf   = k => k==="хос" ? "Та хосын ширээнд сууна." : isNum(k) ? `Та ${k}-р ширээнд сууна.` : `Та ${labelOf(k)} ширээнд сууна.`;

/* "7", "7-р ширээ", "x1", "х1" (кирилл х), "Хосын ширээ" → түлхүүр */
function tableKey(v){
  const s = String(v).toLowerCase().replace(/\s+/g,"");
  if(s.includes("хос")) return "хос";
  const m = s.replace(/х/g,"x").match(/x?\d+/);
  return m ? m[0].replace(/^(x?)0+(?=\d)/,"$1") : null;
}

/* ---------- brand ---------- */
function wordmark(){ return `<div class="wordmark">${CONFIG.LOGO_TEXT}</div>`; }
$("brand").innerHTML = CONFIG.LOGO_URL
  ? `<img class="logo" src="${CONFIG.LOGO_URL}" alt="${CONFIG.LOGO_TEXT}">`
  : wordmark();
const logoEl = document.querySelector(".logo");
if(logoEl) logoEl.addEventListener("error",()=>{ $("brand").innerHTML = wordmark() });

/* ---------- data ---------- */
function parseCSV(text){
  const rows=[]; let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cell+='"';i++} else q=false } else cell+=c }
    else if(c=='"') q=true;
    else if(c==","){ row.push(cell); cell="" }
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&text[i+1]=="\n") i++; row.push(cell); rows.push(row); row=[]; cell="" }
    else cell+=c;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row) }
  return rows;
}
const norm  = s => s.toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/\s+/g," ").trim();
const clean = s => norm(s).replace(/[-–—.,]/g," ").replace(/\s+/g," ").trim();

async function load(){
  try{
    let rows;
    if(!CONFIG.SHEET_ID){ rows = DEMO; }
    else{
      const url = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(CONFIG.SHEET_NAME)}`;
      const res = await fetch(url);
      if(!res.ok) throw new Error(res.status);
      rows = parseCSV(await res.text());
    }
    guests = [];
    rows.forEach((r,i)=>{
      if(!r[0] || !r[1]) return;
      const key = tableKey(r[1]);
      if(!key || !LAYOUT[key]){ if(i>0) console.warn("Танигдаагүй ширээ, мөр "+(i+1)+":", r[0], r[1]); return }   // толгой мөрийг чимээгүй алгасна
      const name = r[0].trim();
      const m = name.match(/^(?:[^\s.]{1,2}\.)+\s*(.+)$/);   // "Э.Бат-Эрдэнэ" → "Бат-Эрдэнэ"
      const tag = (r[2]||"").trim();                         // 3-р багана: ижил нэртэй хүмүүсийг ялгах шошго
      const attended = String(r[3]||"").trim()==="1";        // 4-р багана (D): ирц, 1 = ирсэн
      guests.push({name, tag, attended, table:key, key:clean(name), given:clean(m ? m[1] : name)});
    });
    const cnt = {}; guests.forEach(g=>cnt[g.key]=(cnt[g.key]||0)+1);
    guests.filter(g=>cnt[g.key]>1 && !g.tag).forEach(g=>console.warn("Ижил нэр, шошгогүй:", g.name));
    $("status").textContent = "";
  }catch(e){
    $("status").textContent = "Жагсаалтыг ачаалж чадсангүй. Хуудсаа дахин ачаална уу.";
  }
}

/* ---------- search ---------- */
function find(qs){
  const q = clean(qs); if(!q) return [];
  const toks = q.split(" ");
  const rank = g => g.given.startsWith(q) ? 0 : g.given.split(" ").some(w=>w.startsWith(toks[0])) ? 1 : 2;
  return guests
    .filter(g => toks.every(t => g.key.includes(t)))
    .sort((a,b)=> rank(a)-rank(b) || a.given.localeCompare(b.given))
    .slice(0,8);
}
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  const v = $("q").value;
  const list = $("list");
  if(!v.trim() || !guests.length){ list.hidden=true; $("q").setAttribute("aria-expanded","false"); return }
  shown = find(v); active = -1;
  list.innerHTML = shown.length
    ? shown.map((g,i)=>`<li role="option" data-i="${i}">${esc(g.name)}${g.tag?`<small>${esc(g.tag)}</small>`:""}</li>`).join("")
    : `<li class="msg">Олдсонгүй. Нэрийнхээ бичиглэлийг шалгаад дахин оролдоно уу.</li>`;
  list.hidden=false; $("q").setAttribute("aria-expanded","true");
}
function mark(){
  [...$("list").querySelectorAll("li[role=option]")].forEach((li,i)=>li.setAttribute("aria-selected", i===active));
}
$("q").addEventListener("input",render);
$("q").addEventListener("focus",render);
$("q").addEventListener("keydown",e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); active=Math.min(active+1,shown.length-1); mark() }
  else if(e.key==="ArrowUp"){ e.preventDefault(); active=Math.max(active-1,0); mark() }
  else if(e.key==="Enter"){ if(active>=0) choose(shown[active]); else if(shown.length===1) choose(shown[0]) }
  else if(e.key==="Escape"){ $("list").hidden=true }
});
$("list").addEventListener("click",e=>{
  const li = e.target.closest("li[data-i]"); if(li) choose(shown[+li.dataset.i]);
});
document.addEventListener("click",e=>{ if(!e.target.closest(".search")) $("list").hidden=true });

/* ---------- plan ---------- */
function tableSVG(k, hi){
  const [x,y] = LAYOUT[k];
  let chairs = "";
  for(let i=0;i<10;i++) chairs += `<rect x="24" y="-4" width="10" height="8" rx="2" transform="rotate(${i*36})"/>`;
  return `<g class="tbl${hi?" hi":""}" transform="translate(${x} ${y})">`
    + (hi ? `<circle class="ring" r="36"/>` : "")
    + `<g class="ch">${chairs}</g><circle r="20"/><text>${labelOf(k)}</text></g>`;
}
const arrow = (cx,cy) => `<path d="M${cx-5} ${cy-13}h10v14h6l-11 13-11-13h6z"/>`;
function drawPlan(el, hiKey){
  const keys = Object.keys(LAYOUT).filter(k=>k!=="хос");
  const [cx,cy] = LAYOUT["хос"];
  const hiCouple = hiKey==="хос";
  el.classList.toggle("has-hi", !!hiKey);
  el.innerHTML = `<svg viewBox="${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}" role="img" aria-label="Танхимын ширээний байршил">
    <rect class="block" x="799" y="45" width="69" height="278"/>
    <text class="stage-t" x="833.5" y="184">ТАЙЗ</text>
    <rect class="block" x="16" y="65" width="31" height="117"/>
    <text class="block-t" x="31.5" y="123.5">ТЕК</text>
    <rect class="zone" x="626" y="99" width="171" height="171"/>
    <rect class="floor" x="292" y="197" width="306" height="30"/>
    <g class="entry">${arrow(186,36)}${arrow(251,38)}<text x="218.5" y="8">ОРЦ</text></g>
    ${keys.filter(k=>k!==hiKey).map(k=>tableSVG(k,false)).join("")}
    <g class="pill${hiCouple?" hi":""}">
      ${hiCouple?`<ellipse class="ring" cx="${cx}" cy="${cy}" rx="48" ry="14"/>`:""}
      <ellipse cx="${cx}" cy="${cy}" rx="48" ry="14"/><text x="${cx}" y="${cy}">Хосын ширээ</text>
    </g>
    ${hiKey && !hiCouple ? tableSVG(hiKey,true) : ""}
  </svg>`;
  if(hiKey){
    requestAnimationFrame(()=>{
      const svg = el.querySelector("svg");
      const scale = svg.getBoundingClientRect().width / VIEW.w;
      el.scrollLeft = (LAYOUT[hiKey][0]-VIEW.x)*scale - el.clientWidth/2;
    });
  }
}

/* ---------- popup ---------- */
const ATT_LABEL = "Ирснээ баталгаажуулах";
let current = null;

function showAtt(){
  const on = !!CONFIG.ATTENDANCE_URL && !!current;
  $("attBox").hidden = !on;
  if(!on) return;
  $("attErr").textContent = "";
  $("attBtn").disabled = false; $("attBtn").textContent = ATT_LABEL;
  $("attBtn").hidden = current.attended;
  $("attDone").hidden = !current.attended;
}
function choose(g){
  current = g;
  $("list").hidden=true; $("q").blur();
  $("resName").textContent = g.name;
  $("resTag").textContent = g.tag || "";
  $("resNum").textContent = labelOf(g.table);
  $("resLine").textContent = sayOf(g.table);
  showAtt();
  $("overlay").classList.add("open");
  drawPlan($("resPlan"), g.table);
  $("closeBtn").focus();
}
function closePop(){
  $("overlay").classList.remove("open");
  current = null;
  $("q").value=""; $("list").hidden=true;
}
$("closeBtn").addEventListener("click",closePop);
$("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closePop() });

/* ---------- attendance ---------- */
const openOk  = () => { $("okOverlay").classList.add("open"); $("okClose").focus() };
const closeOk = () => { $("okOverlay").classList.remove("open"); if(current) $("closeBtn").focus() };
$("okClose").addEventListener("click",closeOk);
$("okOverlay").addEventListener("click",e=>{ if(e.target.id==="okOverlay") closeOk() });

$("attBtn").addEventListener("click", async ()=>{
  const g = current; if(!g || g.attended) return;
  const btn = $("attBtn");
  btn.disabled = true; btn.textContent = "Бүртгэж байна…"; $("attErr").textContent = "";
  const ctl = new AbortController(), timer = setTimeout(()=>ctl.abort(), 15000);
  try{
    const res  = await fetch(CONFIG.ATTENDANCE_URL, {method:"POST", body:JSON.stringify({name:g.name, table:g.table, tag:g.tag}), signal:ctl.signal});
    const data = await res.json();
    if(!data.ok) throw new Error((data.error || "failed") + (data.detail ? ": " + data.detail : ""));
    g.attended = true;
    if(current===g) showAtt();
    openOk();
  }catch(e){
    console.error("Attendance error:", e);
    const code = e.name==="AbortError" ? "timeout" : e instanceof SyntaxError ? "bad_response" : e instanceof TypeError ? "network" : e.message;
    if(current===g){ btn.disabled = false; btn.textContent = ATT_LABEL; $("attErr").textContent = "Бүртгэж чадсангүй. Дахин оролдоно уу. (" + code + ")"; }
  }finally{ clearTimeout(timer) }
});

document.addEventListener("keydown",e=>{
  if(e.key!=="Escape") return;
  if($("okOverlay").classList.contains("open")) closeOk();
  else if($("overlay").classList.contains("open")) closePop();
});

load();
</script>
</body>
</html>
